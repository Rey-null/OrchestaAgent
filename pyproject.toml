[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chamber-orchestra"
version = "0.1.0"
description = "Multi-agent orchestration with controlled, evidence-gated recursive harness improvement"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[project.scripts]
chamber = "chamber_orchestra.cli:main"

[tool.setuptools.packages.find]
include = ["chamber_orchestra*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
